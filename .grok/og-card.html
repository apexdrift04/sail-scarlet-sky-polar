<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Syne";
    src: url("fonts/Syne-ExtraBold.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0b10;
  }
  .frame {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 80% at 50% 62%, rgba(255, 90, 54, 0.28) 0%, rgba(255, 90, 54, 0.05) 42%, #0a0b10 72%);
  }
  svg.scene { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .word {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-variation-settings: "wght" 800;
    font-size: 118px;
    line-height: 0.84;
    letter-spacing: 0.16em;
    color: #f3efe8;
    text-indent: 0.16em;
    text-shadow:
      0 0 1px #0a0b10,
      0 3px 0 #0a0b10,
      0 0 22px rgba(10, 11, 16, 0.95),
      0 0 36px rgba(240, 193, 74, 0.28);
  }
  .rule {
    width: 148px;
    height: 3px;
    margin-top: 22px;
    background: linear-gradient(90deg, transparent, #f0c14a, transparent);
  }
  .tag {
    margin-top: 14px;
    font-family: "Syne", sans-serif;
    font-weight: 700;
    font-variation-settings: "wght" 700;
    font-size: 15px;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
    color: #f0c14a;
    text-shadow: 0 0 12px rgba(10, 11, 16, 0.9);
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="scene" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wall" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ff5a36" stop-opacity="0"/>
          <stop offset="35%" stop-color="#ff5a36" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#f0c14a" stop-opacity="0.05"/>
        </linearGradient>
        <radialGradient id="core" cx="50%" cy="42%" r="50%">
          <stop offset="0%" stop-color="#fff6e4"/>
          <stop offset="38%" stop-color="#f0c14a"/>
          <stop offset="72%" stop-color="#ff5a36"/>
          <stop offset="100%" stop-color="#ff5a36" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="18"/>
        </filter>
      </defs>
      <!-- lane walls -->
      <path d="M430 630 L575 40" stroke="url(#wall)" stroke-width="3" fill="none"/>
      <path d="M770 630 L625 40" stroke="url(#wall)" stroke-width="3" fill="none"/>
      <path d="M390 630 L555 70" stroke="#ff5a36" stroke-width="10" fill="none" opacity="0.12" filter="url(#soft)"/>
      <path d="M810 630 L645 70" stroke="#ff5a36" stroke-width="10" fill="none" opacity="0.12" filter="url(#soft)"/>
      <!-- falling ash -->
      <g fill="#1c1e28" stroke="#ff5a36" stroke-width="1.2">
        <polygon points="210,90 228,108 204,124 188,104"/>
        <polygon points="960,70 982,92 948,118 934,90"/>
        <polygon points="280,250 304,268 274,292 252,266"/>
        <polygon points="930,240 956,258 928,286 902,258"/>
        <polygon points="160,420 186,436 162,466 136,442"/>
        <polygon points="1020,400 1048,422 1018,454 988,426"/>
        <polygon points="340,500 360,516 338,540 318,516"/>
        <polygon points="860,510 884,528 858,554 834,528"/>
      </g>
      <!-- spark trail -->
      <g>
        <circle cx="600" cy="520" r="5" fill="#f0c14a"/>
        <circle cx="572" cy="548" r="3" fill="#ff5a36"/>
        <circle cx="634" cy="560" r="4" fill="#f3efe8"/>
        <circle cx="548" cy="490" r="2.5" fill="#f0c14a"/>
        <circle cx="656" cy="500" r="3.2" fill="#ff5a36"/>
        <circle cx="610" cy="580" r="2" fill="#f0c14a"/>
        <circle cx="530" cy="430" r="2" fill="#ff5a36"/>
        <circle cx="680" cy="440" r="2.4" fill="#f0c14a"/>
        <circle cx="500" cy="360" r="1.8" fill="#f3efe8"/>
        <circle cx="710" cy="370" r="2" fill="#ff5a36"/>
        <circle cx="460" cy="220" r="2.2" fill="#f0c14a"/>
        <circle cx="740" cy="200" r="1.6" fill="#ff5a36"/>
        <circle cx="420" cy="140" r="1.5" fill="#f3efe8"/>
        <circle cx="780" cy="150" r="1.8" fill="#f0c14a"/>
      </g>
      <!-- ember ship -->
      <g transform="translate(600 268)">
        <ellipse cx="0" cy="78" rx="34" ry="90" fill="#ff5a36" opacity="0.45" filter="url(#glow)"/>
        <path d="M0 -118 C22 -62 58 8 50 78 C44 128 22 150 0 150 C-22 150 -44 128 -50 78 C-58 8 -22 -62 0 -118 Z" fill="#ff5a36"/>
        <path d="M0 -78 C12 -40 32 10 28 70 C24 108 12 124 0 124 C-12 124 -24 108 -28 70 C-32 10 -12 -40 0 -78 Z" fill="#f0c14a"/>
        <path d="M0 -36 C6 -8 14 18 12 58 C10 82 6 92 0 92 C-6 92 -10 82 -12 58 C-14 18 -6 -8 0 -36 Z" fill="#f3efe8"/>
        <circle cx="0" cy="28" r="8" fill="#fffaf2"/>
      </g>
    </svg>
    <div class="lockup">
      <div class="word">EMBER</div>
      <div class="word">RAID</div>
      <div class="rule"></div>
      <div class="tag">KEEP THE LANE CLEAR</div>
    </div>
  </div>
</body>
</html>
